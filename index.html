// ---------- 1) NOVAS ----------

// Último treino registrado (antes da data informada) desse exercício
function getLastPerformance(exerciseId, beforeDate) {
  const logs = getWorkoutLogs()
    .filter(l => l.workout_date < beforeDate && l.exercises?.some(e => e.exercise_id === exerciseId))
    .sort((a, b) => (a.workout_date < b.workout_date ? 1 : -1));
  if (!logs.length) return null;
  const ex = logs[0].exercises.find(e => e.exercise_id === exerciseId);
  return { date: logs[0].workout_date, sets: ex.sets || [] };
}

// Aceita "82,5" e "82.5"; vazio vira null
function parseNum(raw) {
  const s = String(raw ?? "").trim().replace(",", ".");
  if (s === "") return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}


// ---------- 2) SUBSTITUI openExerciseLog ----------

function openExerciseLog(exerciseId) {
  const workout = WORKOUTS[currentDay];
  const exercise = workout.exercises.find(x => x[0] === exerciseId);
  if (!exercise) return;
  const [id, name, series, rest, rir] = exercise;
  const workoutDate = getLocalDateString();
  const dateInput = document.getElementById("workoutLogDate");
  dateInput.value = workoutDate;
  dateInput.max = workoutDate;
  dateInput.dataset.exerciseId = id;
  document.getElementById("logWorkoutSubtitle").textContent = `${workout.badge} · ${workout.title}`;

  const setCount = getSetCount(series);
  const savedSets = getExerciseSetData(id, workoutDate);
  const last = getLastPerformance(id, workoutDate);

  const fields = Array.from({ length: setCount }, (_, i) => {
    const n = i + 1;
    const saved = savedSets.find(set => set.set_number === n);
    const lastSet = last?.sets.find(set => set.set_number === n) || last?.sets[last.sets.length - 1];

    const reps = saved?.reps ?? "";
    // Carga: usa a salva hoje; senão sugere a do último treino
    const weight = saved?.weight ?? lastSet?.weight ?? "";
    const hint = lastSet && (lastSet.reps || lastSet.weight)
      ? `Última: ${lastSet.weight ?? "—"} kg × ${lastSet.reps ?? "—"}`
      : "";

    return `
      <div class="rounded-xl border border-line bg-[#0b0f14] p-3">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[10px] uppercase tracking-wider text-gray-500 font-black">Série ${n}</span>
          <span class="text-[9px] text-gray-600">${hint}</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <label class="block">
            <span class="block text-[9px] uppercase tracking-wider text-gray-600 font-bold mb-1">Carga (kg)</span>
            <input type="text" inputmode="decimal" data-field="weight" data-exercise-id="${id}" data-set-number="${n}"
                   value="${weight}" placeholder="0"
                   class="w-full bg-[#10141b] border border-line rounded-lg px-3 py-2.5 text-sm outline-none focus:border-lime">
          </label>
          <label class="block">
            <span class="block text-[9px] uppercase tracking-wider text-gray-600 font-bold mb-1">Reps</span>
            <input type="number" min="0" step="1" inputmode="numeric" data-field="reps" data-exercise-id="${id}" data-set-number="${n}"
                   value="${reps}" placeholder="Reps"
                   class="w-full bg-[#10141b] border border-line rounded-lg px-3 py-2.5 text-sm outline-none focus:border-lime">
          </label>
        </div>
      </div>`;
  }).join("");

  const filled = getFilledSetCount(id, series, workoutDate);
  const pct = setCount ? Math.round((filled / setCount) * 100) : 0;

  document.getElementById("workoutLogExercises").innerHTML = `
    <div class="card p-4">
      <div class="flex items-center gap-3 mb-3">
        <div class="exercise-number">${String(workout.exercises.findIndex(x => x[0] === id) + 1).padStart(2, "0")}</div>
        <div class="min-w-0 flex-1">
          <h3 class="font-bold text-sm">${name}</h3>
          <div class="flex flex-wrap gap-1.5 mt-1.5">
            <span class="chip rounded-md px-2 py-1 text-[9px] font-bold">Planejado: ${series}</span>
            <span class="chip rounded-md px-2 py-1 text-[9px]">${rest}</span>
            <span class="chip rounded-md px-2 py-1 text-[9px]">${rir}</span>
          </div>
        </div>
      </div>
      <div class="mb-4">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[9px] uppercase tracking-wider text-gray-600 font-bold">Séries preenchidas</span>
          <span class="text-[10px] font-black text-gray-400">${filled}/${setCount}</span>
        </div>
        <div class="h-2 rounded-full bg-[#0b0f14] border border-line overflow-hidden">
          <div class="h-full bg-lime transition-all duration-300" style="width:${pct}%"></div>
        </div>
        <p class="text-[10px] text-gray-600 mt-2">A carga vem preenchida com a do último treino. Ajuste se mudou. Em exercícios sem peso, deixe vazio ou 0.</p>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${fields}</div>
    </div>`;

  document.getElementById("workoutLogModal").classList.remove("hidden");
  document.body.style.overflow = "hidden";

  // Foca na primeira série sem reps
  const emptyReps = Array.from(document.querySelectorAll(`[data-field="reps"][data-exercise-id="${id}"]`))
    .find(el => el.value === "");
  const target = emptyReps || document.querySelector(`[data-field="reps"][data-exercise-id="${id}"]`);
  if (target) setTimeout(() => target.focus(), 0);
}


// ---------- 3) SUBSTITUI buildExercisePayload ----------

function buildExercisePayload(exerciseId) {
  const workout = WORKOUTS[currentDay];
  const exercise = workout.exercises.find(x => x[0] === exerciseId);
  if (!exercise) return null;

  const [id, name, prescribedSeries] = exercise;
  const setCount = getSetCount(prescribedSeries);
  const workoutDate = document.getElementById("workoutLogDate").value;
  const previousSets = getExerciseSetData(id, workoutDate);

  return {
    workout_date: workoutDate,
    workout_day: currentDay,
    workout_title: workout.title,
    workout_badge: workout.badge,
    completed_at: new Date().toISOString(),
    exercises: [{
      exercise_id: id,
      exercise_name: name,
      prescribed_series: prescribedSeries,
      sets: Array.from({ length: setCount }, (_, i) => {
        const n = i + 1;
        const repsEl = document.querySelector(`[data-field="reps"][data-exercise-id="${id}"][data-set-number="${n}"]`);
        const kgEl = document.querySelector(`[data-field="weight"][data-exercise-id="${id}"][data-set-number="${n}"]`);
        const previous = previousSets.find(set => set.set_number === n);

        const repsRaw = repsEl ? repsEl.value.trim() : "";
        const reps = repsRaw !== "" ? Number(repsRaw) : (previous?.reps ?? null);
        const weight = kgEl ? parseNum(kgEl.value) : (previous?.weight ?? null);

        return { set_number: n, reps, weight };
      })
    }]
  };
}
